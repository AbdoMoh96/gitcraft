name: Release

# Every push to `main` checks the version in Cargo.toml: when release `v<version>` doesn't exist
# yet, GitCraft is built for Linux, macOS and Windows and published as that release (the tag is
# created on the pushed commit). When it exists, nothing is built: bump the version to release.
# Running the workflow by hand (Actions › Release › Run workflow) builds the packages as artifacts
# without publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and quality gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "gitcraft") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Publish only from a push to main, and only a version not released yet.
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::notice::v$version is already released; bump the version in Cargo.toml to publish a new release"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          # Build when publishing, or when started by hand (artifacts only).
          build=$([[ "$publish" == true || "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && echo true || echo false)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish, build $build"
      - name: Linux build dependencies
        if: steps.version.outputs.build == 'true'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: git config --global user.name CI && git config --global user.email ci@example.com
        if: steps.version.outputs.build == 'true'
      - run: cargo xtask ci
        if: steps.version.outputs.build == 'true'

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p gitcraft -p gitcraft-cli
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.target }} ${{ needs.check.outputs.version }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: gitcraft-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A version with a suffix (1.0.0-beta.1) is published as a pre-release.
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          # Creates tag v<version> on the pushed commit.
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "GitCraft $VERSION" \
            --generate-notes \
            "${pre[@]}"

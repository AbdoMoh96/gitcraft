name: CI

# Paused: runs only when started by hand (Actions › CI › Run workflow). The release workflow runs
# the same gates (`cargo xtask ci`) before publishing. To turn it back on, restore:
#   on:
#     push:
#     pull_request:
on:
  workflow_dispatch:

jobs:
  ci:
    strategy:
      # One OS failing must not cancel the others (a cancelled job shows as exit 0xc000013a on
      # Windows and hides whether that OS passes).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: git config --global user.name CI && git config --global user.email ci@example.com
      - run: cargo xtask ci

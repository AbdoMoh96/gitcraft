[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/gitcraft", "apps/gitcraft-cli", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
gitcraft-control-key = { path = "crates/control-key" }
gitcraft-git = { path = "crates/git" }
gitcraft-graph = { path = "crates/graph" }
gitcraft-engine = { path = "crates/engine" }
gitcraft-mcp = { path = "crates/mcp" }
gitcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
